
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voice Assistant</title>
  {% load static %}
  <script src="{% static 'assistant/app.js' %}" defer></script>
  <style>
    body { font-family: Arial; margin: 30px; }
    #output { margin-top: 20px; max-height: 400px; overflow-y: auto; }
    button { margin-right: 10px; padding: 10px 20px; }
  </style>
</head>
<body>
  <h1>🎙️ AI Voice Assistant</h1>
  <button onclick="startListening()">Start</button>
  <button onclick="stopListening()">Stop</button>
  <audio id="responseAudio" controls hidden></audio>

  <div id="output"></div>
</body>
</html>
